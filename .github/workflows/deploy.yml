name: Deploy to Umbraco Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment pipeline at a time: a second run waits instead of fighting over the slot.
concurrency:
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The project lives on the dev Cloud platform; drop this to target production Cloud.
  UMBRACO_CLOUD_API_URL: https://api.dev-cloud.umbraco.com
  UMBRACO_CLOUD_API_KEY: ${{ secrets.UMBRACO_CLOUD_API_KEY }}
  UMBRACO_CLOUD_PROJECT_ID: ${{ secrets.UMBRACO_CLOUD_PROJECT_ID }}
  # Pinned: the CLI is an alpha and can change flags between builds. Bump deliberately.
  UMBRACO_CLI_VERSION: 0.1.1-alpha.58.g7ba0e32
  UMBRACO_CLI_FEED: https://www.myget.org/F/umbracoprereleases/api/v3/index.json
  DOTNET_VERSION: 10.0.x
  TEST_URL: https://test-cli-test.euwest01.rainbowsrock.net
  SLOT_URL: https://prewarm-cli-test.euwest01.rainbowsrock.net
  LIVE_URL: https://cli-test.euwest01.rainbowsrock.net

defaults:
  run:
    shell: bash # -eo pipefail, so a failing command in a pipe fails the step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/Cli.Test/Cli.Test.csproj -c Release -o out

      - name: Write build marker
        # smoke.sh checks this to prove an environment runs this exact build.
        run: echo "${{ github.sha }}" > out/wwwroot/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ env.TEST_URL }}
    outputs:
      # The Cloud artifact this job uploaded; deploy-live deploys the same one without re-uploading.
      artifact_id: ${{ steps.deploy.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Umbraco CLI
        run: |
          dotnet tool install --global Umbraco.Cli --version "$UMBRACO_CLI_VERSION" --add-source "$UMBRACO_CLI_FEED"
          umbraco --version

      - name: Deploy to test
        id: deploy
        run: |
          umbraco cloud deployments deploy \
            --environment test \
            --path out \
            --type artifact \
            --message "$(git log -1 --format='%s (%h)')" \
            --version "${{ github.run_number }}" \
            --output json \
            --no-progress | tee test.json
          id="$(jq -r '.artifactId // empty' test.json)"
          if [[ -z "$id" ]]; then
            echo "::error::No artifactId in the deploy output."
            exit 1
          fi
          echo "artifact_id=$id" >> "$GITHUB_OUTPUT"

      - name: Smoke check test
        run: .github/scripts/smoke.sh "$TEST_URL" "${{ github.sha }}"

  deploy-live:
    needs: deploy-test
    runs-on: ubuntu-latest
    # The `live` GitHub environment has a required reviewer: the run waits here for approval.
    environment:
      name: live
      url: ${{ env.LIVE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Umbraco CLI
        run: |
          dotnet tool install --global Umbraco.Cli --version "$UMBRACO_CLI_VERSION" --add-source "$UMBRACO_CLI_FEED"
          umbraco --version

      - name: Deploy to live slot
        id: slot
        # TEMPORARY: --no-schema-extraction works around a dev-Cloud bug where schema
        # extraction on a slot deployment fails ("could not be converted to System.Guid.
        # Path: $.TaskId", deployment bb9340b9-bee9-4889-970b-a969ff4a8130, 27-11-2026).
        # Live's Deploy schema is NOT refreshed from the .uda files while this is in place.
        # Remove once Cloud is fixed.
        run: |
          umbraco cloud deployments deploy \
            --environment live \
            --slot \
            --no-schema-extraction \
            --artifact-id "${{ needs.deploy-test.outputs.artifact_id }}" \
            --message "$(git log -1 --format='%s (%h)')" \
            --output json \
            --no-progress | tee slot.json
          id="$(jq -r '.deploymentId // empty' slot.json)"
          if [[ -z "$id" ]]; then
            echo "::error::No deploymentId in the deploy output; not swapping."
            exit 1
          fi
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

      - name: Smoke check slot
        run: .github/scripts/smoke.sh "$SLOT_URL" "${{ github.sha }}"

      - name: Swap slot into production
        id: swap
        run: |
          umbraco cloud deployments swap \
            --environment live \
            --deployment-id "${{ steps.slot.outputs.deployment_id }}" \
            --no-progress

      - name: Smoke check live
        run: .github/scripts/smoke.sh "$LIVE_URL" "${{ github.sha }}"

      - name: Reject slot (production unchanged)
        # Runs when anything before the swap failed or the run was cancelled, so an
        # unverified deployment never lingers awaiting a swap. Doesn't run once swapped.
        if: (failure() || cancelled()) && steps.swap.outcome != 'success'
        env:
          DEPLOYMENT_ID: ${{ steps.slot.outputs.deployment_id }}
        run: |
          args=(--environment live --no-progress)
          if [[ -n "$DEPLOYMENT_ID" ]]; then args+=(--deployment-id "$DEPLOYMENT_ID"); fi
          umbraco cloud deployments reject "${args[@]}" \
            || echo "::warning::Reject failed (maybe nothing was awaiting a swap); check the live environment."
